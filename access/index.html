<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZWA | Mission Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }

    .logo {
      width: 90px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
      color: #fff;
      font-weight: 700;
    }

    p.subtitle {
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    /* صندوق المؤقت التنازلي */
    .timer-box {
      border: 1px solid #d4af37;
      background: rgba(212, 175, 55, 0.05);
      border-radius: 8px;
      padding: 6px 20px;
      font-size: 15px;
      color: #fff;
      margin-bottom: 15px;
      display: inline-block;
    }

    .timer-num {
      color: #ff4747;
      font-weight: bold;
      font-size: 18px;
      margin-right: 5px;
    }

    /* صندوق التلميح */
    .hint-box {
      background: #111;
      border: 1px solid #333;
      border-right: 3px solid #d4af37;
      border-radius: 6px;
      padding: 10px 15px;
      font-size: 12px;
      color: #ccc;
      width: 290px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    /* شاشة عرض الأرقام المدخلة */
    .code-display {
      width: 290px;
      height: 55px;
      border: 1.5px solid #d4af37;
      border-radius: 10px;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
    }

    .code-slot {
      font-size: 24px;
      font-weight: bold;
      color: #d4af37;
      width: 25px;
    }

    /* لوحة المفاتيح */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 290px;
    }

    .key-btn {
      background: #121212;
      border: 1px solid #222;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 20px;
      font-weight: bold;
      padding: 16px 0;
      border-radius: 10px;
      cursor: pointer;
      user-select: none;
      transition: all 0.1s ease;
    }

    .key-btn:active {
      background: #d4af37;
      color: #000;
      transform: scale(0.96);
    }

    .key-btn.action-btn {
      font-size: 14px;
      color: #d4af37;
      background: #16140b;
      border-color: #332b12;
    }

    /* شاشة النتيجة والجائزة */
    .result-box {
      display: none;
      width: 290px;
      padding: 20px;
      background: #111;
      border: 1px solid #d4af37;
      border-radius: 12px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.3);
      margin-top: 10px;
    }

    .golden-theme {
      border-color: #ffd700 !important;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.5) !important;
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="EZWA Logo" class="logo" onerror="this.style.display='none'">

  <h1>مهمة اختراق الخزنة</h1>
  <p class="subtitle">أدخل شفرة القطعة السرية قبل انتهاء الوقت</p>

  <div class="timer-box">
    الوقت المتبقي: <span id="timer" class="timer-num">30</span>
  </div>

  <div class="hint-box" id="hint-text">
    💡 التلميح: ابحث عن الكود المطبوع على القطعة
  </div>

  <!-- خانة إدخال الرمز -->
  <div class="code-display" id="display-container">
    <span class="code-slot" id="slot-0">-</span>
    <span class="code-slot" id="slot-1">-</span>
    <span class="code-slot" id="slot-2">-</span>
    <span class="code-slot" id="slot-3">-</span>
  </div>

  <!-- أزرار الكيبورد الرقمي -->
  <div class="keypad" id="keypad-box">
    <button class="key-btn" onclick="pressKey('1')">1</button>
    <button class="key-btn" onclick="pressKey('2')">2</button>
    <button class="key-btn" onclick="pressKey('3')">3</button>
    
    <button class="key-btn" onclick="pressKey('4')">4</button>
    <button class="key-btn" onclick="pressKey('5')">5</button>
    <button class="key-btn" onclick="pressKey('6')">6</button>
    
    <button class="key-btn" onclick="pressKey('7')">7</button>
    <button class="key-btn" onclick="pressKey('8')">8</button>
    <button class="key-btn" onclick="pressKey('9')">9</button>
    
    <button class="key-btn action-btn" onclick="clearCode()">مسح</button>
    <button class="key-btn" onclick="pressKey('0')">0</button>
    <button class="key-btn action-btn" onclick="submitCode()">تأكيد 🔒</button>
  </div>

  <!-- شاشة الجائزة بعد الاختراق -->
  <div class="result-box" id="result-box">
    <h2 style="color:#2ecc71; font-size:18px; margin-top:0;">🎉 تم اختراق الخزنة بنجاح!</h2>
    <p id="reward-text" style="color:#d4af37; font-weight:bold; font-size:16px;"></p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const keyParam = urlParams.get('key') || 'EZWA001';
    
    let currentInput = [];
    let activeKeyData = null;
    let timeLeft = 30;
    let timerInterval = null;

    fetch('keys.json')
      .then(res => res.json())
      .then(data => {
        activeKeyData = data.find(k => k.key === keyParam);
        if (activeKeyData) {
          if (activeKeyData.hint) {
            document.getElementById('hint-text').innerText = activeKeyData.hint;
          }
          startTimer();
        } else {
          document.getElementById('hint-text').innerText = '❌ المفتاح غير صحيح!';
        }
      });

    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert('⏰ انتهى الوقت! أعد فتح الصفحة للمحاولة مجدداً.');
          disableKeypad();
        }
      }, 1000);
    }

    function pressKey(num) {
      if (currentInput.length < 4) {
        currentInput.push(num);
        updateDisplay();
      }
    }

    function clearCode() {
      currentInput = [];
      updateDisplay();
    }

    function updateDisplay() {
      for (let i = 0; i < 4; i++) {
        const slot = document.getElementById(`slot-${i}`);
        slot.innerText = currentInput[i] ? currentInput[i] : '-';
      }
    }

    function submitCode() {
      if (currentInput.length < 4) {
        alert('الرجاء إدخال الرمز المكون من 4 أرقام كاملاً');
        return;
      }

      const enteredCode = currentInput.join('');
      const correctCode = activeKeyData ? activeKeyData.passcode : '2026';

      if (enteredCode === correctCode) {
        clearInterval(timerInterval);
        document.getElementById('keypad-box').style.display = 'none';
        document.getElementById('display-container').style.display = 'none';
        
        const resultBox = document.getElementById('result-box');
        resultBox.style.display = 'block';
        document.getElementById('reward-text').innerText = activeKeyData.reward;

        if (activeKeyData.is_golden) {
          resultBox.classList.add('golden-theme');
        }
      } else {
        alert('❌ الشفرة غير صحيحة، حاول مجدداً!');
        clearCode();
      }
    }

    function disableKeypad() {
      const btns = document.querySelectorAll('.key-btn');
      btns.forEach(b => b.disabled = true);
    }
  </script>
</body>
</html>
