<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZWA | Exclusive Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }

    .logo { width: 90px; margin-bottom: 15px; }
    h1 { font-size: 24px; margin-bottom: 5px; color: #fff; }
    p.subtitle { color: #888; font-size: 13px; margin-bottom: 15px; }

    /* الهالة الذهبية للمفتاح الذهبي */
    .golden-glow {
      border-color: #ffd700 !important;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4) !important;
    }

    /* 1. عناصر وضع الخدش (Scratch Mode) */
    .scratch-box {
      display: none;
      position: relative;
      width: 310px;
      height: 160px;
      margin: 10px auto;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #d4af37;
      background: #111;
    }

    .reward-text {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      padding: 15px;
      box-sizing: border-box;
      color: #d4af37;
    }

    #scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      touch-action: none;
    }

    .riddle-box {
      display: none;
      margin-top: 15px;
      width: 310px;
    }

    .input-style {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: #111;
      color: #fff;
      text-align: center;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      margin-top: 10px;
    }

    .btn-gold {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
    }

    /* 2. عناصر وضع الاختراق (Hack Mode) */
    .hack-container { display: none; flex-direction: column; align-items: center; }
    
    .timer-box {
      border: 1px solid #d4af37;
      background: rgba(212, 175, 55, 0.05);
      border-radius: 8px;
      padding: 5px 15px;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .hint-box {
      background: #111;
      border: 1px solid #333;
      border-right: 3px solid #d4af37;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #ccc;
      width: 290px;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .code-display {
      width: 290px;
      height: 50px;
      border: 1.5px solid #d4af37;
      border-radius: 10px;
      background: #080808;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .code-slot { font-size: 22px; font-weight: bold; color: #d4af37; width: 20px; }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 290px;
    }

    .key-btn {
      background: #121212;
      border: 1px solid #222;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      font-size: 18px;
      font-weight: bold;
      padding: 14px 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .key-btn:active { background: #d4af37; color: #000; }
    .key-btn.action { font-size: 13px; color: #d4af37; background: #16140b; }

    /* الشاشة النهائية للجائزة */
    .result-box {
      display: none;
      width: 290px;
      padding: 20px;
      background: #111;
      border: 1px solid #d4af37;
      border-radius: 12px;
      box-sizing: border-box;
    }

    .geo-status { font-size: 13px; color: #e74c3c; margin-top: 15px; font-weight: bold; }
    .geo-status.success { color: #2ecc71; }
  </style>
</head>
<body>

  <img src="logo.png" alt="EZWA Logo" class="logo" onerror="this.style.display='none'">

  <h1 id="main-title">خزنة عزوة الحصرية</h1>
  <p class="subtitle" id="sub-title">امسح الكارت واكشف أسرار القطعة</p>

  <!-- تنبيه الموقع الجغرافي -->
  <div id="geo-msg" class="geo-status"></div>

  <!-- قسم الاختراق (Hack Mode) -->
  <div id="hack-section" class="hack-container">
    <div class="timer-box">الوقت المتبقي: <span id="timer" style="color:#ff4747; font-weight:bold;">30</span> ثانية</div>
    <div class="hint-box" id="hint-text">💡 التلميح: ابحث عن الكود المطبوع على القطعة</div>
    
    <div class="code-display" id="code-display">
      <span class="code-slot" id="slot-0">-</span>
      <span class="code-slot" id="slot-1">-</span>
      <span class="code-slot" id="slot-2">-</span>
      <span class="code-slot" id="slot-3">-</span>
    </div>

    <div class="keypad" id="keypad">
      <button class="key-btn" onclick="pressKey('1')">1</button>
      <button class="key-btn" onclick="pressKey('2')">2</button>
      <button class="key-btn" onclick="pressKey('3')">3</button>
      <button class="key-btn" onclick="pressKey('4')">4</button>
      <button class="key-btn" onclick="pressKey('5')">5</button>
      <button class="key-btn" onclick="pressKey('6')">6</button>
      <button class="key-btn" onclick="pressKey('7')">7</button>
      <button class="key-btn" onclick="pressKey('8')">8</button>
      <button class="key-btn" onclick="pressKey('9')">9</button>
      <button class="key-btn action" onclick="clearCode()">مسح</button>
      <button class="key-btn" onclick="pressKey('0')">0</button>
      <button class="key-btn action" onclick="submitCode()">تأكيد 🔒</button>
    </div>
  </div>

  <!-- قسم الخدش (Scratch Mode) -->
  <div id="scratch-section" class="scratch-box">
    <div id="scratch-reward" class="reward-text">جاري جلب البيانات...</div>
    <canvas id="scratch-canvas" width="310" height="160"></canvas>
  </div>

  <!-- قسم لغز الكنز -->
  <div id="riddle-section" class="riddle-box">
    <p id="riddle-question" style="color:#fff; font-size:13px; margin:0;"></p>
    <input type="text" id="riddle-input" class="input-style" placeholder="اكتب إجابة اللغز هنا...">
    <button onclick="checkRiddle()" class="btn-gold">تأكيد الإجابة وفتح الجائزة 🔓</button>
  </div>

  <!-- شاشة الجائزة النهائية -->
  <div class="result-box" id="result-box">
    <h2 style="color:#2ecc71; font-size:17px; margin-top:0;">🎉 تم فتح الخزنة بنجاح!</h2>
    <p id="final-reward" style="color:#d4af37; font-weight:bold; font-size:15px;"></p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const keyParam = urlParams.get('key') || 'EZWA001';
    
    let activeData = null;
    let currentInput = [];
    let timeLeft = 30;
    let timerInterval = null;

    fetch('keys.json')
      .then(res => res.json())
      .then(data => {
        activeData = data.find(k => k.key === keyParam);
        if (!activeData) {
          document.getElementById('geo-msg').innerText = '❌ المفتاح غير صحيح!';
          return;
        }

        if (activeData.requires_geo) {
          verifyLocation();
        } else {
          loadVaultMode();
        }
      });

    function verifyLocation() {
      const geoMsg = document.getElementById('geo-msg');
      geoMsg.innerText = '📍 جاري التحقق من موقعك لتفعيل الخزنة...';

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          () => {
            geoMsg.innerText = '✅ تم تأكيد النطاق الجغرافي بنجاح!';
            geoMsg.className = 'geo-status success';
            loadVaultMode();
          },
          () => {
            geoMsg.innerText = '📌 الخزنة مغلقة! يجب التواجد في الموقع المخصص وتفعيل الـ GPS لفتح الكنز 🔒';
          }
        );
      } else {
        loadVaultMode();
      }
    }

    function loadVaultMode() {
      const mode = activeData.mode || 'scratch';

      if (mode === 'hack') {
        document.getElementById('main-title').innerText = 'مهمة اختراق الخزنة';
        document.getElementById('sub-title').innerText = 'أدخل الشفرة السرية قبل انتهاء الوقت';
        document.getElementById('hack-section').style.display = 'flex';
        if (activeData.hint) document.getElementById('hint-text').innerText = activeData.hint;
        startTimer();
      } else {
        document.getElementById('scratch-section').style.display = 'block';
        setupScratchCard();
      }
    }

    /* منطق مهمة الاختراق */
    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert('⏰ انتهى الوقت! أعد فتح الصفحة للمحاولة مجدداً.');
        }
      }, 1000);
    }

    function pressKey(num) {
      if (currentInput.length < 4) {
        currentInput.push(num);
        updateDisplay();
      }
    }

    function clearCode() {
      currentInput = [];
      updateDisplay();
    }

    function updateDisplay() {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`slot-${i}`).innerText = currentInput[i] || '-';
      }
    }

    function submitCode() {
      if (currentInput.join('') === activeData.passcode) {
        clearInterval(timerInterval);
        document.getElementById('hack-section').style.display = 'none';
        showFinalReward();
      } else {
        alert('❌ الشفرة غير صحيحة، حاول مجدداً!');
        clearCode();
      }
    }

    /* منطق بطاقة الخدش واللغز */
    function setupScratchCard() {
      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('scratch-section');
      const hasRiddle = activeData.riddle && activeData.riddle.trim() !== "";

      document.getElementById('scratch-reward').innerText = hasRiddle ? "🧩 تم كشف اللغز! أجب عليه أسفله" : activeData.reward;

      if (activeData.is_golden) container.classList.add('golden-glow');

      ctx.fillStyle = activeData.is_golden ? '#d4af37' : '#222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = activeData.is_golden ? '#000' : '#d4af37';
      ctx.font = 'bold 14px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('اكشط البطاقة لإظهار السر ✍️', canvas.width / 2, canvas.height / 2 + 5);

      let isDrawing = false;
      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(clientX - rect.left, clientY - rect.top, 20, 0, Math.PI * 2);
        ctx.fill();

        if (hasRiddle) {
          document.getElementById('riddle-section').style.display = 'block';
          document.getElementById('riddle-question').innerText = activeData.riddle;
        }
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);

      canvas.addEventListener('touchstart', () => isDrawing = true);
      canvas.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('touchmove', scratch);
    }

    function checkRiddle() {
      const answer = document.getElementById('riddle-input').value.trim();
      if (answer === activeData.riddle_answer) {
        document.getElementById('riddle-section').style.display = 'none';
        document.getElementById('scratch-section').style.display = 'none';
        showFinalReward();
      } else {
        alert('الإجابة غير صحيحة، حاول مجدداً!');
      }
    }

    function showFinalReward() {
      const resultBox = document.getElementById('result-box');
      resultBox.style.display = 'block';
      document.getElementById('final-reward').innerText = activeData.reward;
      if (activeData.is_golden) resultBox.classList.add('golden-glow');
    }
  </script>
</body>
</html>
