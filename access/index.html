<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZWA | Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .logo {
      width: 120px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #fff;
    }

    p.subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 30px;
    }

    /* حاوية بطاقة الخدش */
    .scratch-card-box {
      position: relative;
      width: 320px;
      height: 160px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      border: 1px solid #d4af37;
      background: #111;
    }

    /* الجائزة التي تظهر تحت الطلاء */
    .reward-text {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      text-align: center;
      padding: 15px;
      box-sizing: border-box;
      color: #d4af37;
    }

    #scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      touch-action: none;
    }

    /* هالة المفتاح الذهبي الاستثنائية */
    .golden-mode {
      border: 2px solid #ffd700 !important;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.7) !important;
      background: linear-gradient(145deg, #2a2408, #000) !important;
    }
  </style>
</head>
<body>

  <!-- الشعار الرئيسي -->
  <img src="logo.png" alt="EZWA Logo" class="logo" onerror="this.style.display='none'">

  <h1>خزنة عزوة الحصرية</h1>
  <p class="subtitle">امسح الكارت واكشف المفاجأة الخاصة بقطعتك</p>

  <!-- كرت الخدش التفاعلي -->
  <div id="scratch-container" class="scratch-card-box">
    <div id="scratch-reward" class="reward-text">جاري التحقق من المفتاح...</div>
    <canvas id="scratch-canvas" width="320" height="160"></canvas>
  </div>

  <script>
    // قراءة المفتاح من رابط الصفحة تلقائياً
    const urlParams = new URLSearchParams(window.location.search);
    const keyParam = urlParams.get('key') || 'EZWA001';

    // جلب البيانات من ملف keys.json
    fetch('keys.json')
      .then(res => res.json())
      .then(data => {
        const currentKey = data.find(k => k.key === keyParam);
        if (currentKey) {
          initScratchCard(currentKey.reward || 'خصم خاص لحاملي القطعة', currentKey.is_golden);
        } else {
          initScratchCard('عذراً، المفتاح غير صحيح', false);
        }
      })
      .catch(() => {
        // حالة احتياطية للعرض التجريبي
        initScratchCard('مبروك! حصلت على خصم VIP حصري', true);
      });

    // تشغيل نظام الخدش باللمس أو الماوس
    function initScratchCard(rewardText, isGolden) {
      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('scratch-container');
      
      document.getElementById('scratch-reward').innerText = rewardText;

      if (isGolden) {
        container.classList.add('golden-mode');
      }

      // رسم طبقة الطلاء (ذهبي للمفتاح الذهبي / رمادي دكن للعادي)
      ctx.fillStyle = isGolden ? '#d4af37' : '#222222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // كتابة النص فوق الطلاء
      ctx.fillStyle = isGolden ? '#000000' : '#d4af37';
      ctx.font = 'bold 16px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('احكِ البطاقة لإظهار المفاجأة ✍️', canvas.width / 2, canvas.height / 2 + 5);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);

      canvas.addEventListener('touchstart', () => isDrawing = true);
      canvas.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('touchmove', scratch);
    }
  </script>
</body>
</html>
