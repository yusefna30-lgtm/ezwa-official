<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZWA Access</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Inter,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
width:90%;
max-width:500px;
animation:fade 1s ease;
}

.logo{
width:180px;
margin-bottom:60px;
}

.logo img{
width:100%;
}

.status{
font-size:13px;
letter-spacing:4px;
color:#777;
margin-bottom:12px;
text-transform:uppercase;
}

.title{
font-size:42px;
font-weight:700;
letter-spacing:3px;
margin-bottom:18px;
}

.subtitle{
font-size:16px;
color:#9d9d9d;
margin-bottom:60px;
line-height:1.8;
}

.line{
width:70px;
height:1px;
background:#333;
margin:0 auto 40px;
}

.vault{
font-size:22px;
font-weight:600;
margin-bottom:10px;
}

.small{
color:#666;
font-size:14px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>
<body>

<div class="container">

<div class="logo">
<img src="logo.png" alt="EZWA">
</div>

<div class="status">
NFC VERIFIED
</div>

<div class="title">
ACCESS GRANTED
</div>

<div class="subtitle">
Your EZWA piece has been successfully verified.
</div>

<div class="line"></div>

<div class="vault">
🔒 The Vault is Closed
</div>

<div class="small">
The next opening will be announced soon.
</div>

</div>

</body>
</html>
