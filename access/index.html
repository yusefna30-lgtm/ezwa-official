<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- منع المتصفح من ترجمة الصفحة تلقائياً -->
  <meta name="google" content="notranslate">
  <title>تم منح الإذن بالدخول | عزوة</title>
  
  <!-- خط عربي حديث (Cairo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base Settings */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Centered Container Layout */
    .access-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100%;
      padding: 2rem;
      text-align: center;
      animation: fadeIn 1.2s ease-out forwards;
    }

    /* Logo Wrapper & Styling */
    .logo-wrapper {
      margin-bottom: 2.5rem;
      max-width: 220px;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrapper img {
      width: 100%;
      height: auto;
      object-fit: contain;
    }

    /* Fallback Text Logo */
    .logo-fallback {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #ffffff;
    }

    /* Main Heading */
    .access-title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffffff;
      margin-bottom: 0.75rem;
    }

    /* Subtitle */
    .access-subtitle {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #888888;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .logo-wrapper {
        max-width: 160px;
        margin-bottom: 2rem;
      }
    }
  </style>
</head>
<body class="notranslate">

  <main class="access-container">
    <!-- شعار عزوة -->
    <div class="logo-wrapper">
      <img src="logo.png" alt="عزوة" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span class="logo-fallback translate-no" translate="no" style="display: none;">عزوة</span>
    </div>

    <!-- العنوان الرئيسي -->
    <h1 class="access-title">تم منح الإذن بالدخول</h1>

    <!-- العنوان الفرعي -->
    <p class="access-subtitle">أهلاً بكم في <span translate="no">عزوة</span></p>
  </main>

</body>
</html>
