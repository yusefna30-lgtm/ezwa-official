<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EZWA | Vault Access</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Cairo', sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }

    .logo {
      width: 100px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
      color: #fff;
    }

    p.subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 25px;
    }

    /* حاوية بطاقة الخدش */
    .scratch-card-box {
      position: relative;
      width: 320px;
      height: 170px;
      margin: 15px auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      border: 1px solid #d4af37;
      background: #111;
    }

    .reward-text {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      padding: 15px;
      box-sizing: border-box;
      color: #d4af37;
    }

    #scratch-canvas {
      position: absolute;
      top: 0;
      left: 0;
      cursor: pointer;
      touch-action: none;
    }

    /* هالة المفتاح الذهبي */
    .golden-mode {
      border: 2px solid #ffd700 !important;
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.8) !important;
      background: linear-gradient(145deg, #2a2408, #000) !important;
    }

    /* قسم لغز الكنز */
    .riddle-box {
      display: none;
      margin-top: 15px;
      width: 320px;
    }

    input.riddle-input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d4af37;
      background: #111;
      color: #fff;
      text-align: center;
      font-family: 'Cairo', sans-serif;
      font-size: 14px;
      box-sizing: border-box;
      margin-top: 10px;
    }

    button.btn-unlock {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      background: #d4af37;
      color: #000;
      font-weight: bold;
      font-family: 'Cairo', sans-serif;
      cursor: pointer;
    }

    .wa-help-btn {
      display: inline-block;
      margin-top: 12px;
      color: #25D366;
      text-decoration: none;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid #25D366;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(37, 211, 102, 0.05);
    }

    .geo-status {
      font-size: 12px;
      color: #e74c3c;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="EZWA Logo" class="logo" onerror="this.style.display='none'">

  <h1>خزنة عزوة الحصرية</h1>
  <p class="subtitle" id="sub-title">امسح الكارت واكشف أسرار القطعة</p>

  <!-- كرت الخدش التفاعلي -->
  <div id="scratch-container" class="scratch-card-box">
    <div id="scratch-reward" class="reward-text">جاري جلب بيانات الخزنة...</div>
    <canvas id="scratch-canvas" width="320" height="170"></canvas>
  </div>

  <!-- قسم لغز الكنز -->
  <div id="riddle-container" class="riddle-box">
    <p id="riddle-question" style="color:#fff; font-size:14px; margin:0;"></p>
    <input type="text" id="riddle-answer-input" class="riddle-input" placeholder="اكتب إجابة اللغز هنا...">
    <button onclick="checkRiddle()" class="btn-unlock">تأكيد الإجابة وفتح الجائزة 🔓</button>
    <div id="riddle-feedback"></div>
  </div>

  <div id="geo-msg" class="geo-status"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const keyParam = urlParams.get('key') || 'EZWA001';
    let activeKeyData = null;

    fetch('keys.json')
      .then(res => res.json())
      .then(data => {
        activeKeyData = data.find(k => k.key === keyParam);
        if (activeKeyData) {
          if (activeKeyData.requires_geo) {
            verifyLocation();
          } else {
            setupVault();
          }
        } else {
          initScratchCard('عذراً، المفتاح غير صحيح ❌', false);
        }
      })
      .catch(() => {
        initScratchCard('عذراً، تعذر الاتصال بالنظام', false);
      });

    function verifyLocation() {
      document.getElementById('geo-msg').innerText = '📍 جاري التحقق من موقعك لتفعيل الخزنة الجغرافية...';
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(() => {
          document.getElementById('geo-msg').innerText = '✅ تم تأكيد النطاق الجغرافي بنجاح!';
          setupVault();
        }, () => {
          document.getElementById('geo-msg').innerText = '⚠️ يلزم تفعيل الموقع الجغرافي (GPS) لفتح هذه الخزنة الخاصة.';
          initScratchCard('خزنة مغلقة جغرافياً 🔒', false);
        });
      } else {
        setupVault();
      }
    }

    function setupVault() {
      const hasRiddle = activeKeyData.riddle && activeKeyData.riddle !== "";
      const textOnScratch = hasRiddle ? "🧩 تم كشف اللغز! أجب عليه أسفله" : activeKeyData.reward;
      
      initScratchCard(textOnScratch, activeKeyData.is_golden, hasRiddle);
    }

    function initScratchCard(rewardText, isGolden, hasRiddle) {
      const canvas = document.getElementById('scratch-canvas');
      const ctx = canvas.getContext('2d');
      const container = document.getElementById('scratch-container');
      
      document.getElementById('scratch-reward').innerText = rewardText;

      if (isGolden) {
        container.classList.add('golden-mode');
      }

      ctx.fillStyle = isGolden ? '#d4af37' : '#222222';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = isGolden ? '#000000' : '#d4af37';
      ctx.font = 'bold 15px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('احكِ البطاقة لإظهار السر ✍️', canvas.width / 2, canvas.height / 2 + 5);

      let isDrawing = false;

      function scratch(e) {
        if (!isDrawing) return;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.fill();

        if (hasRiddle) {
          document.getElementById('riddle-container').style.display = 'block';
          document.getElementById('riddle-question').innerText = activeKeyData.riddle;
        }
      }

      canvas.addEventListener('mousedown', () => isDrawing = true);
      canvas.addEventListener('mouseup', () => isDrawing = false);
      canvas.addEventListener('mousemove', scratch);

      canvas.addEventListener('touchstart', () => isDrawing = true);
      canvas.addEventListener('touchend', () => isDrawing = false);
      canvas.addEventListener('touchmove', scratch);
    }

    // دالة التحقق من الإجابة ورابط الواتساب المباشر
    function checkRiddle() {
      const userAnswer = document.getElementById('riddle-answer-input').value.trim();
      const feedbackDiv = document.getElementById('riddle-feedback');

      if (userAnswer === activeKeyData.riddle_answer) {
        document.getElementById('scratch-reward').innerText = activeKeyData.reward;
        feedbackDiv.innerHTML = '<p style="color:#2ecc71; font-weight:bold; margin-top:10px;">🎉 إجابة صحيحة! تم فتح الكنز بنجاح.</p>';
      } else {
        const waMsg = encodeURIComponent("مرحباً، محتاج مساعدة في حل لغز خزنة عزوة للمفتاح: " + keyParam);
        const waLink = `https://wa.me/966502777884?text=${waMsg}`;
        
        feedbackDiv.innerHTML = `
          <p style="color:#e74c3c; font-size:13px; margin-top:10px; margin-bottom:5px;">الإجابة غير صحيحة، حاول مجدداً!</p>
          <a href="${waLink}" target="_blank" class="wa-help-btn">
            💬 لم تعرف الجواب؟ طلب المساعدة عبر الواتساب
          </a>
        `;
      }
    }
  </script>
</body>
</html>
