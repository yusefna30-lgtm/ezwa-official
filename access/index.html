<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="google" content="notranslate">

<title>EZWA | Access</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{

width:100%;
height:100%;
background:#000;
color:#fff;
font-family:'Cairo',sans-serif;

}

body{

display:flex;
justify-content:center;
align-items:center;

}

.container{

width:100%;
max-width:820px;
padding:40px 25px;
text-align:center;

}

.logo{

width:180px;
margin:auto;
margin-bottom:45px;

}

.logo img{

width:100%;

}

.fade{

transition:.5s;

}

.title{

font-size:42px;
font-weight:800;
margin-bottom:12px;

}

.subtitle{

color:#8e8e8e;
font-size:16px;
margin-bottom:35px;

}

.verify{

font-size:15px;
letter-spacing:2px;
color:#8e8e8e;

}

.check{

font-size:55px;
margin-bottom:20px;

}

.key-card{

display:inline-block;
padding:14px 30px;
background:#111;
border:1px solid #222;
border-radius:8px;
margin-top:25px;

}

.key-title{

font-size:13px;
color:#777;

}

.key-value{

font-size:19px;
margin-top:6px;
font-weight:700;

}

.vault-box{

margin-top:40px;
background:#111;
border:1px solid #222;
padding:25px;
border-radius:8px;

}

.status{

font-size:20px;
font-weight:700;
margin-bottom:20px;

}
.status-date{

display:flex;
justify-content:space-between;
margin-top:20px;
padding-top:20px;
border-top:1px solid #222;

}

.date-box{

flex:1;

}

.date-title{

font-size:13px;
color:#777;
margin-bottom:8px;

}

.date-value{

font-size:16px;
font-weight:600;

}

.countdown{

display:flex;
justify-content:center;
gap:18px;
margin-top:35px;

}

.time-box{

background:#0d0d0d;
border:1px solid #222;
border-radius:8px;
padding:18px;
min-width:75px;

}

.time-number{

font-size:28px;
font-weight:700;

}

.time-label{

font-size:12px;
color:#777;
margin-top:8px;

}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px;
margin-top:35px;

}

.card{

background:#111;
border:1px solid #222;
border-radius:8px;
padding:22px;

}

.card h3{

margin-bottom:12px;

}

.card p{

color:#888;
line-height:1.8;
margin-bottom:18px;

}

.card a{

display:block;
background:#fff;
color:#000;
text-decoration:none;
padding:12px;
border-radius:5px;
font-weight:700;

}

.footer{

margin-top:45px;
font-size:13px;
color:#666;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="logo.png" alt="EZWA">

</div>

<div id="app" class="fade">

<div class="verify">

جاري التحقق...

</div>

</div>

</div>
<script>

let CONFIG={};

async function loadVault(){

  let PRODUCTS={};
let KEY_DATA=null;

  let OWNERS=[];

async function loadOwners(){

const response=await fetch("owners.json?"+Date.now());

OWNERS=await response.json();

}
  
async function loadProducts(){

const response=await fetch("products.json?"+Date.now());

const list=await response.json();

list.forEach(item=>{

PRODUCTS[item.id]=item;

});

}

const response=await fetch("vault.json?"+Date.now());

CONFIG=await response.json();

}

const app=document.getElementById("app");

const params=new URLSearchParams(location.search);

const token=params.get("token");

const key=params.get("key");

  async function validateKey() {

    const res = await fetch("keys.json?" + Date.now());
    const keys = await res.json();

    const found = keys.find(k => k.key === key);

    KEY_DATA = found;

    
    if (!found) {

        document.getElementById("app").innerHTML = `
        <div class="title">مفتاح غير صالح</div>
        <div class="subtitle">هذه القطعة غير مسجلة في EZWA.</div>
        `;
        return false;
    }

    if (found.status !== "active") {

        document.getElementById("app").innerHTML = `
        <div class="title">تم إيقاف المفتاح</div>
        <div class="subtitle">لا يمكن استخدام هذه القطعة حالياً.</div>
        `;
        return false;
    }

    return true;
}
  
function render(html){

app.innerHTML=html;

}

function keyCard(){

return`

<div class="key-card">

<div class="key-title">

مفتاحك

</div>

<div class="key-value">

${key||"غير معروف"}

</div>

</div>

`;

}

function statusPanel(open){

return`

<div class="vault-box">

<div class="status">

${open?"🟢 الخزنة مفتوحة":"🔒 الخزنة مغلقة"}

</div>

<div class="status-date">

<div class="date-box">

<div class="date-title">

آخر فتح

</div>

<div class="date-value">

${CONFIG.last_opening_date}

</div>

</div>

<div class="date-box">

<div class="date-title">

الفتح القادم

</div>

<div class="date-value">

${CONFIG.next_opening_date}

</div>

</div>

</div>

</div>

`;

}
  function showSuccess(){

render(`

<div class="check">

✓

</div>

<div class="title">

تم التحقق

</div>

<div class="subtitle">

تم التحقق من مفتاح عزوة بنجاح.

</div>

${keyCard()}

`);

setTimeout(showVault,800);

}

function showVault(){

const target=new Date(CONFIG.opening_timestamp).getTime();

const now=new Date().getTime();

const isOpen=(CONFIG.status==="open")||(now>=target);

  const PRODUCT = PRODUCTS[KEY_DATA.product];

  const OWNER = KEY_DATA.owner;
  
if(isOpen){

let cardsHTML=`

<div class="card">

<h3>${PRODUCT.name}</h3>

<p>

${PRODUCT.description}

</p>

${PRODUCT.image ? `<img src="${PRODUCT.image}" style="width:100%;border-radius:12px;margin-top:10px;">` : ""}

</div>

`;
  
render(`

<div class="title">

<div class="product-info">

<h2>${PRODUCT.name}</h2>

<p>اللون: ${PRODUCT.color}</p>

<p>المقاس: ${PRODUCT.size}</p>

</div>

${CONFIG.title}

</div>

<div class="subtitle">

${CONFIG.subtitle}

</div>

${statusPanel(true)}

<div class="product-info">

<p><strong>رقم المنتج:</strong> ${KEY_DATA.product}</p>

<p><strong>رمز المفتاح:</strong> ${KEY_DATA.key}</p>

<p><strong>الحالة:</strong> ${KEY_DATA.status}</p>

</div>

<div class="cards">

${cardsHTML}

</div>

<div class="product-info">

<p><strong>اسم المالك:</strong> ${KEY_DATA.owner?.name || "غير مسجل"}</p>

<p><strong>رقم الجوال:</strong> ${KEY_DATA.owner?.phone || "غير متوفر"}</p>

<p><strong>البريد الإلكتروني:</strong> ${KEY_DATA.owner?.email || "غير متوفر"}</p>

</div>

<div class="footer">

يتم تحديث محتوى الخزنة باستمرار.

</div>

`);

}else{

render(`

<div class="title">

${CONFIG.title}

</div>

<div class="subtitle">

الخزنة مغلقة حالياً، سيتم فتحها في الموعد المحدد.

</div>

${statusPanel(false)}

<div class="countdown">

<div class="time-box">

<div id="days" class="time-number">00</div>

<div class="time-label">يوم</div>

</div>

<div class="time-box">

<div id="hours" class="time-number">00</div>

<div class="time-label">ساعة</div>

</div>
<div class="time-box">

<div id="minutes" class="time-number">00</div>

<div class="time-label">دقيقة</div>

</div>

<div class="time-box">

<div id="seconds" class="time-number">00</div>

<div class="time-label">ثانية</div>

</div>

</div>

<div class="footer">

يتم تحديث محتوى الخزنة باستمرار.

</div>

`);

startCountdown(target);

}

}

function startCountdown(target){

function update(){

const now=new Date().getTime();

const distance=target-now;

if(distance<=0){

CONFIG.status="open";

showVault();

return;

}

const days=Math.floor(distance/(1000*60*60*24));

const hours=Math.floor((distance%(1000*60*60*24))/(1000*60*60));

const minutes=Math.floor((distance%(1000*60*60))/60000);

const seconds=Math.floor((distance%(1000*60))/1000);

document.getElementById("days").textContent=String(days).padStart(2,"0");

document.getElementById("hours").textContent=String(hours).padStart(2,"0");

document.getElementById("minutes").textContent=String(minutes).padStart(2,"0");

document.getElementById("seconds").textContent=String(seconds).padStart(2,"0");

}

update();

setInterval(update,1000);

}
(async()=>{

await loadVault();

if(!(await validateKey())) return;

setTimeout(()=>{

showSuccess();

},1800);

})();
  
document.addEventListener("visibilitychange",()=>{

if(document.visibilityState==="visible"){

const target=new Date(CONFIG.opening_timestamp).getTime();

if(new Date().getTime()>=target){

CONFIG.status="open";

showVault();

}

}

});

  </script>

</body>

</html>
